[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-sensing-point-segmentation"
version = "0.1.0"
description = "Reproducible point-supervised LandCover.ai segmentation experiments"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src*", "scripts*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["cuda: requires CUDA hardware", "real_data: requires verified LandCover.ai data"]

[tool.ruff]
line-length = 100
